name: "Terraform Infrastructure Pipeline"

on:
  pull_request:
    branches: [master]
    paths:
      - "**.tf"
      - "**.tfvars"
      - ".github/workflows/terraform.yml"
  push:
    branches: [master]
    paths:
      - "**.tf"
      - "**.tfvars"

env:
  TF_VERSION: "1.6.0"

  # Variables para autenticación con Azure
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  # Variables para autenticación con AWS
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: us-west-2

  # JWT Secret para Terraform
  TF_VAR_jwt_secret: ${{ secrets.TF_VAR_JWT_SECRET }}

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./

    steps:
      # Checkout del código
      - name: Checkout
        uses: actions/checkout@v4

      # Setup de Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Configurar AWS CLI (necesario para los comandos del script)
      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      # Terraform Init
      - name: Terraform Init
        run: terraform init

      # Terraform Format Check
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # Terraform Plan
      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan -no-color
        continue-on-error: false

      # Comentar el plan en el PR
      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            // Obtener el output del plan
            const planOutput = execSync('terraform show -no-color tfplan', { encoding: 'utf8' });

            const output = `#### Terraform Plan 📖
            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${planOutput}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      # Terraform Apply (solo en push a master) - PRIMER APPLY
      - name: Terraform Apply (Initial)
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan

      # Ejecutar script de deployment automatizado
      - name: Run Deployment Script
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          chmod +x deploy.sh
          ./deploy.sh
        env:
          JWT_SECRET: ${{ secrets.TF_VAR_JWT_SECRET }}

      # Cleanup
      - name: Cleanup
        if: always()
        run: rm -f tfplan terraform.tfstate.backup *.bak *.bak2
